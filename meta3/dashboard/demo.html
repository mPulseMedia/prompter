<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta3 Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: row;
            height: 100vh;
        }
        
        /* Main content area - left section */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: #0d1117;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        #circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #1f6feb;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 40px;
        }
        
        #circle.expanded {
            width: 250px;
            height: 250px;
        }
        
        #circle:hover {
            background-color: #f85149;
        }
        
        #circle-color-change-button {
            background: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
            transition: background-color 0.2s;
            width: 200px;
        }
        
        #circle-color-change-button:hover {
            background: #2ea043;
        }
        
        #double-click-button {
            background: #6e40c9;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.1s ease;
            user-select: none;
            width: 200px;
        }
        
        #double-click-button:hover {
            background: #8956ff;
        }
        
        #double-click-button.clicked {
            background: #f85149;
            transform: scale(1.1);
        }
        
        #reload-button {
            background: #0969da;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        
        #reload-button:hover {
            background: #0860ca;
        }
        
        #run-tests-button {
            background: #2ea043;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        
        #run-tests-button:hover {
            background: #238636;
        }
        
        #run-tests-button:disabled {
            background: #6e7681;
            cursor: not-allowed;
        }
        
        /* Server restart button removed - bad practice */
        
        #status-message {
            color: #c9d1d9;
            font-size: 13px;
            height: 20px;
            font-weight: normal;
        }
        
        /* Right panel container */
        .test-panel-right {
            width: 320px;
            background: #161b22;
            border-left: 2px solid #30363d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Controls section at top */
        .controls-section {
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
            color: #c9d1d9;
        }
        
        .controls-section button {
            width: 95px;
            font-size: 12px;
        }
        
        .controls-section label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .controls-section input[type="checkbox"] {
            cursor: pointer;
        }
        
        .controls-section #status-message {
            color: #c9d1d9;
        }
        
        /* Test results list */
        .test-results-list {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
        }
        
        .test-names-scroll {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .test-name {
            flex: 1;
        }
        
        .loading {
            color: #c9d1d9;
            font-size: 13px;
        }
        
        .error-message {
            color: #c9d1d9;
            font-size: 13px;
        }
        
        /* Test list items */
        .test-name-item {
            padding: 4px 10px;
            display: flex;
            align-items: center;
            font-size: 13px;
            gap: 8px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
        }
        
        .test-name {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .test-name-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .test-status-icon {
            font-size: 11px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <!-- Main content area - Circle Demo Only -->
    <div class="main-content">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div id="circle"></div>
            <button id="circle-color-change-button">Change Color</button>
            <button id="double-click-button">Double Click Me!</button>
        </div>
    </div>
    
    <!-- Right Panel -->
    <div class="test-panel-right">
        <!-- Controls Section -->
        <div class="controls-section">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="reload-button">↻ Page</button>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" id="auto-reload-checkbox">
                    ↻ 10s
                </label>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="run-tests-button">↻ Tests</button>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" id="auto-test-checkbox">
                    ↻ 40s
                </label>
            </div>
            <!-- Server restart removed - servers should not self-terminate -->
            <div>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" id="test-visibility-checkbox" checked>
                    <span id="test-visibility-label">Test shown</span>
                </label>
            </div>
            <div id="test-time-display" style="font-size: 13px; color: #c9d1d9;"></div>
            <div id="status-message"></div>
        </div>
        
        <!-- Test Results List -->
        <div class="test-results-list">
            <div class="test-names-scroll" id="test-list">
                <div class="loading">Loading test names...</div>
            </div>
        </div>
    </div>
    
    <script>
        // CRITICAL: Declare these variables FIRST before any other code
        const isDashboardWindow = !window.location.search.includes('test-mode');
        const storagePrefix = isDashboardWindow ? '' : 'test_';
        console.log('Window type:', isDashboardWindow ? 'dashboard' : 'test', 'Storage prefix:', '"' + storagePrefix + '"');
        
        // Track if we're unloading to prevent errors
        let isUnloading = false;
        
        // Declare interval variables at top level
        let countdownInterval = null;
        let testCountdownInterval = null;
        let refreshTimer = null;
        
        // Clean up before unload
        window.addEventListener('beforeunload', () => {
            isUnloading = true;
            // Clear all intervals
            if (window.reloadInterval) clearTimeout(window.reloadInterval);
            if (window.testInterval) clearTimeout(window.testInterval);
            if (countdownInterval) clearInterval(countdownInterval);
            if (testCountdownInterval) clearInterval(testCountdownInterval);
            if (refreshTimer) clearInterval(refreshTimer);
        });
        
        // Now initialize other variables and functionality
        const circle = document.getElementById('circle');
        const circleColorChangeButton = document.getElementById('circle-color-change-button');
        const statusMessage = document.getElementById('status-message');
        
        // Page health check - recover if page is stuck
        window.addEventListener('load', () => {
            // Clear any stuck states from previous sessions
            if (isDashboardWindow) {
                // Check if we just came from a failed reload
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('_t')) {
                    // Remove timestamp parameter for clean URL
                    urlParams.delete('_t');
                    const newUrl = window.location.pathname + (urlParams.toString() ? '?' + urlParams.toString() : '');
                    window.history.replaceState({}, '', newUrl);
                }
                
                // Reset any stuck intervals from previous page loads
                const storedIntervals = ['reloadStartTime', 'testStartTime'];
                storedIntervals.forEach(key => {
                    const stored = localStorage.getItem(storagePrefix + key);
                    if (stored) {
                        const age = Date.now() - parseInt(stored);
                        // If older than 5 minutes, clear it
                        if (age > 300000) {
                            localStorage.removeItem(storagePrefix + key);
                            console.log(`Cleared old ${key} (age: ${Math.floor(age/1000)}s)`);
                        }
                    }
                });
            }
        });
        
        // Store color scheme state
        let isHovering = false;
        let currentColorScheme = 0;
        
        // Define color schemes: [normal, hover]
        const colorSchemes = [
            ['#1f6feb', '#f85149'], // Original: blue -> red
            ['#2ea043', '#fd7e14'], // Green -> orange  
            ['#6e40c9', '#e74c3c'], // Purple -> red
            ['#0969da', '#28a745'], // Dark blue -> green
            ['#dc3545', '#6f42c1']  // Red -> purple
        ];
        
        function updateCircleColors() {
            const [normalColor, hoverColor] = colorSchemes[currentColorScheme];
            circle.style.backgroundColor = isHovering ? hoverColor : normalColor;
        }
        
        circle.addEventListener('mouseenter', function() {
            isHovering = true;
            updateCircleColors();
            console.log('Circle hover: entered');
        });
        
        circle.addEventListener('mouseleave', function() {
            isHovering = false;
            updateCircleColors();
            console.log('Circle hover: left');
        });
        
        circle.addEventListener('click', function() {
            circle.classList.toggle('expanded');
            console.log('Circle clicked: ' + (circle.classList.contains('expanded') ? 'expanded' : 'normal'));
        });
        
        circleColorChangeButton.addEventListener('click', function() {
            // Cycle to next color scheme
            currentColorScheme = (currentColorScheme + 1) % colorSchemes.length;
            
            // Reset state
            isHovering = false;
            circle.classList.remove('expanded');
            
            // Apply new colors
            updateCircleColors();
            
            const [normalColor, hoverColor] = colorSchemes[currentColorScheme];
            statusMessage.textContent = `Colors changed! Scheme ${currentColorScheme + 1}`;
            console.log(`Reset: switched to color scheme ${currentColorScheme + 1}`);
            
            setTimeout(() => {
                statusMessage.textContent = '';
            }, 2000);
        });
        
        // Double-click button functionality
        const doubleClickButton = document.getElementById('double-click-button');
        let clickCount = 0;
        let singleClickTimer = null;
        
        // Add single click feedback for better responsiveness
        doubleClickButton.addEventListener('click', function() {
            // Briefly flash the button to show click registered
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
            }, 100);
        });
        
        doubleClickButton.addEventListener('dblclick', function() {
            clickCount++;
            doubleClickButton.textContent = `Clicked ${clickCount} times!`;
            doubleClickButton.classList.add('clicked');
            console.log('Double-click detected, count:', clickCount);
            
            setTimeout(() => {
                doubleClickButton.classList.remove('clicked');
            }, 300);
        });
        
        // Reload functionality
        const reloadButton = document.getElementById('reload-button');
        const autoReloadCheckbox = document.getElementById('auto-reload-checkbox');
        let reloadInterval = null;
        window.reloadInterval = null; // Expose globally for test cleanup
        let reloadCountdown = 10;
        
        async function performReload() {
            console.log('Performing reload...');
            
            // Clear all intervals before reloading
            stopAutoReload();
            stopAutoTest();
            if (refreshTimer) clearInterval(refreshTimer);
            
            // Clear any test-related state
            if (!isDashboardWindow) {
                localStorage.clear();
            }
            
            // Wait a moment for cleanup
            await new Promise(resolve => setTimeout(resolve, 100));
            
            // For test windows, just use simple reload
            if (!isDashboardWindow) {
                window.location.reload(true); // Force reload from server
                return;
            }
            
            // Simplified reload - the health check was causing issues
            window.location.reload();
        }
        
        reloadButton.addEventListener('click', function() {
            console.log('Manual reload triggered');
            performReload();
        });
        
        autoReloadCheckbox.addEventListener('change', function() {
            // Only allow auto-reload on dashboard window
            if (!isDashboardWindow) {
                this.checked = false;
                console.log('Auto-reload disabled in test window');
                return;
            }
            
            if (this.checked) {
                console.log('Auto-reload enabled');
                // Store in localStorage so it persists after reload
                localStorage.setItem(storagePrefix + 'autoReload', 'true');
                startAutoReload();
            } else {
                console.log('Auto-reload disabled');
                localStorage.setItem(storagePrefix + 'autoReload', 'false');
                stopAutoReload();
            }
        });
        
        function startAutoReload() {
            // Restore countdown from localStorage or start fresh
            const savedReloadTime = localStorage.getItem(storagePrefix + 'reloadStartTime');
            const now = Date.now();
            
            if (savedReloadTime) {
                const elapsed = Math.floor((now - parseInt(savedReloadTime)) / 1000);
                reloadCountdown = Math.max(1, 10 - (elapsed % 10));
            } else {
                reloadCountdown = 10;
                localStorage.setItem(storagePrefix + 'reloadStartTime', now.toString());
            }
            
            updateReloadButton();
            
            // Start countdown display
            countdownInterval = setInterval(() => {
                reloadCountdown--;
                updateReloadButton();
                if (reloadCountdown <= 0) {
                    reloadCountdown = 10;
                }
            }, 1000);
            
            // Calculate time until next reload
            const timeUntilReload = reloadCountdown * 1000;
            
            reloadInterval = setTimeout(() => {
                console.log('Auto-reload triggered');
                performReload();
            }, timeUntilReload);
            
            window.reloadInterval = reloadInterval; // Expose globally
        }
        
        function stopAutoReload() {
            if (reloadInterval) {
                clearTimeout(reloadInterval);
                reloadInterval = null;
                window.reloadInterval = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            localStorage.removeItem(storagePrefix + 'reloadStartTime');
            reloadButton.textContent = '↻ Page';
        }
        
        function updateReloadButton() {
            if (autoReloadCheckbox.checked) {
                reloadButton.textContent = `↻ Page (${reloadCountdown}s)`;
            } else {
                reloadButton.textContent = '↻ Page';
            }
        }
        
        // Check if auto-reload was enabled before (only for dashboard)
        if (isDashboardWindow) {
            try {
                const savedAutoReload = localStorage.getItem(storagePrefix + 'autoReload');
                console.log('Loading autoReload:', storagePrefix + 'autoReload', '=', savedAutoReload);
                if (savedAutoReload === 'true') {
                    autoReloadCheckbox.checked = true;
                    startAutoReload();
                }
            } catch (error) {
                console.error('Error loading auto-reload state:', error);
            }
        } else {
            // Disable auto-reload checkbox in test windows
            autoReloadCheckbox.disabled = true;
            autoReloadCheckbox.checked = false;
        }
        
        // Test running functionality
        const runTestsButton = document.getElementById('run-tests-button');
        const autoTestCheckbox = document.getElementById('auto-test-checkbox');
        let testInterval = null;
        window.testInterval = null; // Expose globally for test cleanup
        let isRunningTests = false;
        let testCountdown = 40;
        
        async function stopTests() {
            try {
                const response = await fetch('/api/stop-tests', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    console.log('Tests stopped successfully');
                    // Also try to close any open test windows
                    const testWindows = window.open('', 'meta3-test-window');
                    if (testWindows && !testWindows.closed) {
                        testWindows.close();
                    }
                }
            } catch (error) {
                console.error('Error stopping tests:', error);
            }
        }
        
        async function runTests() {
            // First stop any running tests
            await stopTests();
            
            // Short delay to ensure cleanup completes
            await new Promise(resolve => setTimeout(resolve, 500));
            
            isRunningTests = true;
            runTestsButton.disabled = true;
            runTestsButton.textContent = 'Running Tests...';
            statusMessage.textContent = 'Running tests...';
            
            try {
                const testVisible = localStorage.getItem(storagePrefix + 'testVisible') !== 'false';
                const response = await fetch('/api/run-tests', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        headless: !testVisible
                    })
                });
                
                if (response.ok) {
                    statusMessage.textContent = 'Tests completed!';
                    
                    // Record test completion time
                    lastTestTime = new Date();
                    localStorage.setItem(storagePrefix + 'lastTestTime', lastTestTime.toISOString());
                    updateVisibilityLabel();
                    
                    // Wait a bit then reload test results
                    setTimeout(() => {
                        loadTests();
                        statusMessage.textContent = '';
                    }, 2000);
                } else if (response.status === 409) {
                    const data = await response.json();
                    statusMessage.textContent = data.message || 'Tests already running';
                    console.log('Tests already running, will retry on next cycle');
                } else {
                    statusMessage.textContent = 'Failed to run tests';
                }
            } catch (error) {
                console.error('Error running tests:', error);
                statusMessage.textContent = 'Error running tests';
            } finally {
                isRunningTests = false;
                runTestsButton.disabled = false;
                runTestsButton.textContent = '↻ Tests';
            }
        }
        
        runTestsButton.addEventListener('click', runTests);
        
        autoTestCheckbox.addEventListener('change', function() {
            if (this.checked) {
                console.log('Auto-test enabled');
                localStorage.setItem(storagePrefix + 'autoTest', 'true');
                startAutoTest();
            } else {
                console.log('Auto-test disabled');
                localStorage.setItem(storagePrefix + 'autoTest', 'false');
                stopAutoTest();
            }
        });
        
        function startAutoTest() {
            // Only set initial timestamp when first enabling auto-test
            if (!localStorage.getItem(storagePrefix + 'testStartTime')) {
                localStorage.setItem(storagePrefix + 'testStartTime', Date.now().toString());
            }
            
            // Start countdown (will continue from where it left off)
            startTestCountdown();
        }
        
        function stopAutoTest() {
            if (testInterval) {
                clearTimeout(testInterval);
                testInterval = null;
                window.testInterval = null;
            }
            if (testCountdownInterval) {
                clearInterval(testCountdownInterval);
                testCountdownInterval = null;
            }
            localStorage.removeItem(storagePrefix + 'testStartTime');
            runTestsButton.textContent = '↻ Tests';
        }
        
        function startTestCountdown() {
            // Get the saved test cycle start time
            const savedTestTime = localStorage.getItem(storagePrefix + 'testStartTime');
            const now = Date.now();
            
            if (savedTestTime) {
                const startTime = parseInt(savedTestTime);
                const elapsed = Math.floor((now - startTime) / 1000);
                
                // If more than 60 seconds have passed, run tests immediately
                if (elapsed >= 40) {
                    console.log('Test timer expired during page reload, running tests now');
                    runTests();
                    // Reset for next cycle
                    localStorage.setItem(storagePrefix + 'testStartTime', now.toString());
                    testCountdown = 40;
                } else {
                    // Continue countdown from where we left off
                    testCountdown = 40 - elapsed;
                }
            } else {
                testCountdown = 40;
                localStorage.setItem(storagePrefix + 'testStartTime', now.toString());
            }
            
            updateTestButton();
            
            // Start countdown display
            testCountdownInterval = setInterval(() => {
                testCountdown--;
                updateTestButton();
                if (testCountdown <= 0) {
                    // Don't reset here - let the timeout handle it
                }
            }, 1000);
            
            // Calculate time until next test
            const timeUntilTest = testCountdown * 1000;
            
            testInterval = setTimeout(() => {
                console.log('Auto-test triggered');
                runTests();
                // Reset the start time for next cycle
                localStorage.setItem(storagePrefix + 'testStartTime', Date.now().toString());
                testCountdown = 40;
                // Clear and restart
                stopAutoTest();
                if (autoTestCheckbox.checked) {
                    startAutoTest();
                }
            }, timeUntilTest);
            
            window.testInterval = testInterval; // Expose globally
        }
        
        function updateTestButton() {
            if (autoTestCheckbox.checked && !isRunningTests) {
                runTestsButton.textContent = `↻ Tests (${testCountdown}s)`;
            } else if (!isRunningTests) {
                runTestsButton.textContent = '↻ Tests';
            }
            // Don't change text while tests are running
        }
        
        // Check if auto-test was enabled before
        try {
            const savedAutoTest = localStorage.getItem(storagePrefix + 'autoTest');
            console.log('Loading autoTest:', storagePrefix + 'autoTest', '=', savedAutoTest);
            if (savedAutoTest === 'true' && isDashboardWindow) {
                autoTestCheckbox.checked = true;
                // Don't call startAutoTest() - just continue the countdown
                startTestCountdown();
            }
        } catch (error) {
            console.error('Error loading auto-test state:', error);
        }
        
        // Test visibility functionality
        const testVisibilityCheckbox = document.getElementById('test-visibility-checkbox');
        const testVisibilityLabel = document.getElementById('test-visibility-label');
        let lastTestTime = null;
        
        // Load saved test visibility preference
        const savedVisibility = localStorage.getItem(storagePrefix + 'testVisible');
        console.log('Loading testVisible:', storagePrefix + 'testVisible', '=', savedVisibility);
        if (savedVisibility !== null) {
            testVisibilityCheckbox.checked = savedVisibility === 'true';
        }
        
        // Load last test time from localStorage
        const savedLastTestTime = localStorage.getItem(storagePrefix + 'lastTestTime');
        if (savedLastTestTime) {
            lastTestTime = new Date(savedLastTestTime);
        }
        
        function formatPacificTime(date) {
            if (!date) return '';
            return date.toLocaleTimeString('en-US', {
                timeZone: 'America/Los_Angeles',
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }
        
        function updateVisibilityLabel() {
            testVisibilityLabel.textContent = 'Show Test Window';
            
            // Update separate time display
            const timeDisplay = document.getElementById('test-time-display');
            if (lastTestTime) {
                timeDisplay.textContent = `Last ${formatPacificTime(lastTestTime)}`;
            } else {
                timeDisplay.textContent = '';
            }
        }
        
        updateVisibilityLabel();
        
        testVisibilityCheckbox.addEventListener('change', function() {
            localStorage.setItem(storagePrefix + 'testVisible', this.checked.toString());
            updateVisibilityLabel();
            console.log('Test visibility:', this.checked ? 'shown' : 'hidden');
        });
        
        // Server restart functionality removed - servers should not self-terminate
        // If you need to restart the server, do it manually from the terminal
        
        // Test results functionality
        let currentRunningTest = null;
        
        async function loadTests() {
            const testList = document.getElementById('test-list');
            
            // Don't try to fetch if we're unloading
            if (isUnloading) return;
            
            try {
                // Get test results
                const response = await fetch('/api/test');
                if (!response.ok) {
                    throw new Error('Failed to fetch test results');
                }
                const testData = await response.json();
                const tests = testData.tests || testData; // Handle both new and old API format
                
                // If we don't have a lastTestTime yet, try to get it from test results
                if (!lastTestTime && testData.timestamp) {
                    lastTestTime = new Date(testData.timestamp);
                    localStorage.setItem(storagePrefix + 'lastTestTime', lastTestTime.toISOString());
                    updateVisibilityLabel();
                }
                
                // Get current test status (only for test windows)
                let statusData = {};
                if (!isDashboardWindow) {
                    try {
                        const statusResponse = await fetch('/api/test/status');
                        if (statusResponse.ok) {
                            statusData = await statusResponse.json();
                            
                            if (statusData.currentTest && statusData.currentTest.name) {
                                currentRunningTest = statusData.currentTest.name;
                            }
                        }
                    } catch (error) {
                        console.error('Error fetching test status:', error);
                    }
                } else {
                    currentRunningTest = null; // No test status for dashboard windows
                }
                
                if (!tests || tests.length === 0) {
                    testList.innerHTML = '<div class="error-message">No test results</div>';
                    return;
                }
                
                // Sort tests alphabetically by name
                tests.sort((a, b) => a.name.localeCompare(b.name));
                
                // Display tests in bottom panel - scrollable list
                testList.innerHTML = tests.map((test) => {
                    const status = test.passed ? '🟢' : '🔴';
                    const errorInfo = test.error ? ` - ${test.error}` : '';
                    const isRunning = currentRunningTest === test.name;
                    const actionText = (isRunning && statusData.currentTest && statusData.currentTest.action) 
                        ? ` : ${statusData.currentTest.action}` 
                        : '';
                    
                    return `
                        <div class="test-name-item">
                            <span class="test-status-icon">${isRunning ? '🟡' : status}</span>
                            <span class="test-name">${test.name}${actionText}${errorInfo}</span>
                        </div>
                    `;
                }).join('');
                
                // If we have a pre-existing running test, add it to the list if it's not there
                if (currentRunningTest && !tests.find(t => t.name === currentRunningTest)) {
                    const runningTestHtml = `
                        <div class="test-name-item">
                            <span class="test-status-icon">🟡</span>
                            <span class="test-name">${currentRunningTest}</span>
                        </div>
                    `;
                    testList.innerHTML = runningTestHtml + testList.innerHTML;
                }
                
            } catch (error) {
                testList.innerHTML = `<div class="error-message">Error loading tests</div>`;
            }
        }
        
        // Load tests on page load
        loadTests();
        
        // Auto-refresh - faster during test runs
        let refreshInterval = 5000;
        
        function startTestRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            
            refreshTimer = setInterval(async () => {
                await loadTests();
                
                // Check if tests are running to adjust refresh rate (only for test windows)
                if (!isDashboardWindow) {
                    try {
                        const statusResponse = await fetch('/api/test/status');
                        if (statusResponse.ok) {
                            const statusData = await statusResponse.json();
                            
                            if (statusData.isRunning && refreshInterval !== 1000) {
                                // Speed up refresh during tests
                                refreshInterval = 1000;
                                startTestRefresh();
                            } else if (!statusData.isRunning && refreshInterval !== 5000) {
                                // Slow down when tests complete
                                refreshInterval = 5000;
                                startTestRefresh();
                            }
                        }
                    } catch (error) {
                        // Ignore errors during refresh - server might be temporarily unavailable
                    }
                }
            }, refreshInterval);
        }
        
        startTestRefresh();
    </script>
</body>
</html>
